[project]
name = "inex-web"
version = "0.1.0"
description = "Portal público de indicadores do ensino superior brasileiro"
requires-python = ">=3.11"
dependencies = [
    "flask==3.1.1",
    "flask-limiter==4.1.1",
    "duckdb==1.3.0",
    "gunicorn==23.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff==0.11.13",
]

[tool.ruff]
line-length = 100
target-version = "py311"
